name: Salesforce user cases (no AI)
on:
  workflow_dispatch:
    inputs:
      run_kind:
        description: Execute explicitly supplied JUnit classes or a learned dataset suite
        required: true
        default: junit
        type: choice
        options: [junit, suite]
      test_class:
        description: Fully qualified user IT class already committed in sf-e2e-tests
        required: false
        type: string
      suite_manifest:
        description: Reviewed suite JSON path available in the checkout/approved artifacts (suite mode)
        required: false
        type: string
      strict_locators:
        description: Fail if a mapped primary locator changes
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: salesforce-java-${{ vars.SF_ORG_ALIAS || 'configured-org' }}
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: salesforce-e2e
    env:
      RUN_KIND: ${{ inputs.run_kind }}
      USER_TEST_CLASS: ${{ inputs.test_class }}
      SUITE_MANIFEST: ${{ inputs.suite_manifest }}
      STRICT_LOCATORS: ${{ inputs.strict_locators }}
      SF_BASE_URL: ${{ vars.SF_BASE_URL }}
      SF_LIGHTNING_ORIGIN: ${{ vars.SF_LIGHTNING_ORIGIN }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_JWT_PRIVATE_KEY: ${{ secrets.SF_JWT_PRIVATE_KEY }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_ORG_ALIAS: ${{ vars.SF_ORG_ALIAS }}
      SF_JWT_AUDIENCE: ${{ vars.SF_JWT_AUDIENCE }}
      SF_TOKEN_ORIGIN: ${{ vars.SF_TOKEN_ORIGIN }}
      SF_START_ROUTE: ${{ vars.SF_START_ROUTE }}
      SF_UI_LANGUAGE: ${{ vars.SF_UI_LANGUAGE }}
      SF_UI_LOCALE: ${{ vars.SF_UI_LOCALE }}
      SF_UI_CURRENCY: ${{ vars.SF_UI_CURRENCY }}
      SF_TIME_ZONE: ${{ vars.SF_TIME_ZONE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp package -DskipTests
      - run: java -cp sf-e2e-cli/target/sf-e2e.jar com.microsoft.playwright.CLI install --with-deps chromium
      - run: ./mvnw -B -ntp verify -Pchecks
      - name: Run explicitly selected user cases or dataset suite
        shell: bash
        run: |
          if [[ "$RUN_KIND" == "suite" ]]; then
            if [[ -z "$SUITE_MANIFEST" ]]; then echo 'Suite mode requires suite_manifest.' >&2; exit 2; fi
            args=(run-suite --profile deterministic --suite "$SUITE_MANIFEST" --locator-mode read-only)
          elif [[ "$RUN_KIND" == "junit" ]]; then
            if [[ -z "$USER_TEST_CLASS" ]]; then echo 'JUnit mode requires test_class.' >&2; exit 2; fi
            args=(run --profile deterministic --test-class "$USER_TEST_CLASS" --locator-mode read-only)
          else
            echo 'Unsupported run_kind.' >&2; exit 2
          fi
          if [[ "$STRICT_LOCATORS" == "true" ]]; then args+=(--strict-locators); fi
          java -cp "sf-e2e-cli/target/sf-e2e.jar:sf-e2e-tests/target/test-classes" hu.ak91.sf.e2e.cli.SfE2eCli "${args[@]}"
      - name: Preserve evidence, mappings and permanent journals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: salesforce-java-${{ github.run_id }}
          include-hidden-files: true
          path: |
            report/
            .sf-e2e/locators/
            .sf-e2e-data/
          retention-days: 90
