name: Java framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: framework-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Java CLI
        shell: bash
        run: ./mvnw -B -ntp package -DskipTests
      - name: Install Chromium, Firefox and WebKit
        shell: bash
        run: java -cp sf-e2e-cli/target/sf-e2e.jar com.microsoft.playwright.CLI install --with-deps chromium firefox webkit
      - name: Run credential-free checks
        shell: bash
        run: ./mvnw -B -ntp verify -Pchecks
      - name: Check English framework text and documentation links
        shell: bash
        run: node scripts/check-project-language.mjs
      - name: Check adapters, change collection and output budgets
        shell: bash
        run: node --test scripts/model-output-limit.test.mjs scripts/component-adapter.test.mjs scripts/collect-changes.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14
