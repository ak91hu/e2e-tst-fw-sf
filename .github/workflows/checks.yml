name: Java framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: framework-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
      - name: Pin npm build tooling
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Build Java CLI
        shell: bash
        run: ./mvnw -B -ntp package -DskipTests
      - name: Install Chromium, Firefox and WebKit
        shell: bash
        run: java -cp sf-e2e-cli/target/sf-e2e.jar com.microsoft.playwright.CLI install --with-deps chromium firefox webkit
      - name: Run credential-free checks
        shell: bash
        run: ./mvnw -B -ntp verify -Pchecks
      - name: Check English framework text and documentation links
        shell: bash
        run: node scripts/check-project-language.mjs
      - name: Check adapters, change collection and output budgets
        shell: bash
        run: node --test scripts/model-output-limit.test.mjs scripts/component-adapter.test.mjs scripts/collect-changes.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14
